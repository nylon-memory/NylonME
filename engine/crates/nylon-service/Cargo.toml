[package]
name = "nylon-service"
description = "NylonME engine core: weave/resonate/search logic shared by server and mobile (transport-agnostic)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nylon-core = { path = "../nylon-core" }
nylon-graph = { path = "../nylon-graph" }
nylon-vector = { path = "../nylon-vector" }
nylon-storage = { path = "../nylon-storage" }
nylon-embed = { path = "../nylon-embed" }
nylon-llm = { path = "../nylon-llm" }
tokio = { version = "1", features = ["rt", "macros"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
