[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nylon-sdk"
version = "0.2.1"
description = "Official Python client for the NylonME memory engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "NylonME Authors", email = "dev@nylonmemory.dev" }]
keywords = ["memory", "agent", "llm", "grpc", "nylonme"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "grpcio>=1.60",
    "protobuf>=5.26",
]

[project.urls]
Homepage = "https://github.com/nylon-memory/NylonME"
Repository = "https://github.com/nylon-memory/NylonME"

[tool.setuptools.packages.find]
where = ["src"]