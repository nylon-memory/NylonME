{{- if or .Values.llm.apiKey .Values.auth.apiKeysJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nylonme.fullname" . }}-secrets
  labels:
    {{- include "nylonme.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.llm.apiKey }}
  llm-api-key: {{ .Values.llm.apiKey | quote }}
  {{- end }}
  {{- if .Values.auth.apiKeysJson }}
  api-keys: {{ .Values.auth.apiKeysJson | quote }}
  {{- end }}
{{- end }}
