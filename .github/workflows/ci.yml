name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang libclang-dev pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: fmt
        run: cargo fmt --all --check
        working-directory: engine
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
        working-directory: engine
      - name: test
        run: cargo test --workspace
        working-directory: engine
  sdk-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK
        run: pip install ./sdk/python
      - name: Import smoke test
        run: python -c "from nylon_sdk import NylonClient, AsyncNylonClient, __version__; print('import ok', __version__)"
      - name: Stubs match the proto
        run: |
          pip install grpcio-tools
          python sdk/python/tools/codegen.py
          git diff --exit-code -- sdk/python/src/nylon_sdk/_gen